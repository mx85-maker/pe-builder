const selected={};let inputs={};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
DATA.forEach((s,si)=>{let d=document.createElement('details');d.className='section';d.open=si<3;d.innerHTML='<summary>['+s.title+']</summary><div class="fields"></div>';let holder=d.querySelector('.fields');s.fields.forEach((f,fi)=>{let key=si+'_'+fi,el=document.createElement('div');el.className='field';el.innerHTML='<div class="fieldname">'+escapeHtml(f.name)+' <small>（'+escapeHtml(f.zh)+'）</small></div>';if(f.type==='choices'){let wrap=document.createElement('div');wrap.className='choices';f.options.forEach(([en,zh],oi)=>{let lab=document.createElement('label');lab.className='choice';lab.innerHTML='<input type="checkbox" value="'+oi+'"><span>'+escapeHtml(en)+'<em>'+escapeHtml(zh)+'</em></span>';let inp=lab.querySelector('input');inp.addEventListener('change',()=>{if(!selected[key])selected[key]=new Set();inp.checked?selected[key].add(oi):selected[key].delete(oi);render()});wrap.append(lab)});el.append(wrap)}else if(f.type==='text'){let wrap=document.createElement('div');wrap.className='inputrow';let inp=document.createElement('input');inp.placeholder=f.hint;inp.setAttribute('aria-label',f.name);inp.addEventListener('input',render);inputs[key]=inp;wrap.append(inp);let hint=document.createElement('span');hint.className='hint';hint.textContent='請填：'+f.hint;wrap.append(hint);el.append(wrap)}else{let wrap=document.createElement('div');wrap.className='gcs';['E','V','M'].forEach((v,i)=>{let lab=document.createElement('label');lab.textContent=v;let sel=document.createElement('select');sel.setAttribute('aria-label','GCS '+v);sel.innerHTML='<option value="">—</option>'+Array.from({length:[4,5,6][i]},(_,j)=>'<option value="'+(j+1)+'">'+(j+1)+'</option>').join('');sel.addEventListener('change',render);inputs[key+'_'+v]=sel;lab.append(sel);wrap.append(lab)});el.append(wrap)}holder.append(el)});container.append(d)});
function render(){let lines=[];DATA.forEach((s,si)=>{let items=[];s.fields.forEach((f,fi)=>{let key=si+'_'+fi;if(f.type==='choices'){let chosen=[...(selected[key]||[])].sort((a,b)=>a-b).map(i=>f.options[i][0]);if(chosen.length)items.push(f.name+': '+chosen.join(', ')+'.')}else if(f.type==='text'){let v=inputs[key].value.trim();if(v){let val=v;if(f.template.includes('____')&&!v.includes('cm')&&f.template.endsWith('cm'))val=v+' cm';items.push(f.name+': '+val+'.')}}else{let vals=['E','V','M'].map(k=>inputs[key+'_'+k].value);if(vals.some(Boolean))items.push('GCS: '+['E','V','M'].map((k,i)=>k+(vals[i]||'__')).join('')+'.')}});if(items.length){lines.push('['+s.title+']');lines.push(items.join('\n'));lines.push('')}});output.value=lines.join('\n').trim();status.textContent=lines.length?'已依目前選項更新':'尚未選擇任何項目'}
document.getElementById('clear').onclick=()=>{Object.keys(selected).forEach(k=>selected[k].clear());document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);Object.values(inputs).forEach(x=>x.value='');render()};
document.getElementById('normal').onclick=()=>{document.getElementById('clear').click();const normals={'GENERAL APPEARANCE':{'Appearance':'Fair-looking'},'CONSCIOUSNESS':{'Consciousness':'Alert and oriented'},'HEENT':{'Sclerae':'Anicteric','Conjunctivae':'Pink','Oral cavity':'Oral mucosa intact','Tongue':'Normal appearance','Throat':'No pharyngeal injection'},'NECK':{'Neck':'Supple','JVD':'No JVD','Trachea':'Midline','Cervical lymph nodes':'No palpable lymphadenopathy','Carotid bruits':'None'},'CHEST':{'Breathing':'Unlabored','Chest expansion':'Symmetric','Accessory muscle use':'No use','Breath sounds':'Clear bilaterally','Wheezing':'None','Crackles':'None'},'HEART':{'Heart rhythm':'Regular','Heart sounds':'Normal S1 and S2','S3':'Not audible','S4':'Not audible'},'ABDOMEN':{'Appearance':'Soft and flat','Tenderness':'None','Rebound tenderness':'None','Muscle guarding':'None','Bowel sounds':'Normoactive'},'BACK':{'CVA tenderness':'None bilaterally'},'EXTREMITIES':{'Joint deformity':'None','Range of motion':'Full','Pitting edema':'None'},'SKIN':{'Skin integrity':'Intact','Wound':'None'}};DATA.forEach((s,si)=>s.fields.forEach((f,fi)=>{let en=normals[s.title]?.[f.name];if(!en)return;let oi=f.options?.findIndex(x=>x[0]===en);if(oi>=0){let key=si+'_'+fi;selected[key]=new Set([oi]);let node=container.children[si].querySelectorAll('.field')[fi].querySelectorAll('input[type=checkbox]')[oi];node.checked=true}}));['E','V','M'].forEach((v,i)=>inputs['1_1_'+v].value=[4,5,6][i]);render();status.textContent='已預填常見正常結果；請逐項確認是否實際檢查'};
document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);
document.getElementById('collapse').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
document.getElementById('refresh').onclick=render;
document.getElementById('copy').onclick=async()=>{if(!output.value.trim()){status.textContent='沒有可複製的內容';return}try{await navigator.clipboard.writeText(output.value);status.textContent='已複製英文病歷'}catch(e){output.focus();output.select();try{document.execCommand('copy');status.textContent='已嘗試複製；如未成功請按 Ctrl+C'}catch(e){status.textContent='請按 Ctrl+C 複製選取內容'}}};
render();
</script></body></html>
